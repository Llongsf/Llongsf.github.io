<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影集 | 业余爱好展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-300 selection:bg-emerald-500 selection:text-black">

    <div class="max-w-7xl mx-auto px-6 py-12">
        <!-- 返回主页 -->
        <a href="index.html" class="inline-flex items-center text-sm text-slate-400 hover:text-emerald-400 transition-colors mb-8">
            <i class="fa-solid fa-arrow-left mr-2"></i> 返回主页
        </a>

        <div class="mb-12">
            <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-4">光影瞬间 / Photography</h1>
            <p class="text-sm text-slate-400 max-w-2xl">在代码与控制理论之外，我用镜头捕捉世界的确定性与随机性。这里记录了我对建筑、人文与自然风光的思考。</p>
        </div>

        <!-- 瀑布流/网格照片墙 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- 照片卡片 1 -->
            <div class="glass-card rounded-xl overflow-hidden group">
                <div class="relative overflow-hidden aspect-[4/3] bg-slate-900 flex items-center justify-center">
                    <!-- ⚠️ 实际使用时：src="assets/photo1.jpg" -->
                    <img src="assets/photo1.jpg" alt="摄影作品" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden')" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    <div class="hidden text-slate-600 text-center"><i class="fa-solid fa-image text-3xl mb-1"></i><p class="text-xs">暂无图片 (photo1.jpg)</p></div>
                </div>
                <div class="p-4 border-t border-slate-800/60">
                    <span class="mono-font text-[10px] text-emerald-400 uppercase tracking-widest block mb-1">城市建筑 / Urban</span>
                    <h3 class="text-sm font-bold text-slate-200">赛博城市的一隅</h3>
                </div>
            </div>

            <!-- 更多照片卡片可以复制上方结构... -->

        </div>
    </div>

</body>
</html>
