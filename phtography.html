<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影集 | 业余爱好展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-300 selection:bg-emerald-500 selection:text-black bg-[#0B0F19] overflow-x-hidden">

    <div data-parallax-hero class="relative h-[42vh] min-h-[280px] overflow-hidden border-b border-slate-800/80">
        <div data-parallax-layer data-speed="0.15" class="parallax-hero-layer absolute inset-0 bg-gradient-to-b from-emerald-950/40 to-[#0B0F19]"></div>
        <div data-parallax-layer data-speed="0.35" class="parallax-hero-layer absolute inset-0 opacity-30"
            style="background-image: radial-gradient(circle at 20% 30%, rgba(16,185,129,0.25), transparent 50%), radial-gradient(circle at 80% 70%, rgba(6,182,212,0.2), transparent 45%);"></div>
        <div data-parallax-layer data-speed="0.5" class="parallax-hero-layer absolute inset-0 cyber-grid-light opacity-40"></div>
        <div class="relative z-10 h-full max-w-7xl mx-auto px-6 flex flex-col justify-end pb-12">
            <a href="index.html" class="inline-flex items-center text-sm text-slate-400 hover:text-emerald-400 transition-colors mb-6 w-fit">
                <i class="fa-solid fa-arrow-left mr-2"></i> 返回主页
            </a>
            <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-3">光影瞬间 / Photography</h1>
            <p class="text-sm text-slate-400 max-w-2xl">全景视差滚动 + 懒加载骨架屏。将照片放入 assets/photo1.jpg 等路径即可自动展示。</p>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 py-16">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

            <article data-photo-card class="photo-card-parallax glass-card rounded-xl overflow-hidden">
                <div class="relative aspect-[4/3] overflow-hidden bg-slate-900">
                    <div data-skeleton class="skeleton-shimmer absolute inset-0 z-10 transition-opacity duration-500"></div>
                    <img data-src="assets/photo1.jpg" alt="赛博城市的一隅" class="w-full h-full object-cover opacity-0 transition-opacity duration-700">
                </div>
                <div class="p-4 border-t border-slate-800/60">
                    <span class="mono-font text-[10px] text-emerald-400 uppercase tracking-widest block mb-1">城市建筑</span>
                    <h3 class="text-sm font-bold text-slate-200">赛博城市的一隅</h3>
                </div>
            </article>

            <article data-photo-card class="photo-card-parallax glass-card rounded-xl overflow-hidden lg:mt-12">
                <div class="relative aspect-[3/4] overflow-hidden bg-slate-900">
                    <div data-skeleton class="skeleton-shimmer absolute inset-0 z-10 transition-opacity duration-500"></div>
                    <img data-src="assets/photo2.jpg" alt="人文街拍" class="w-full h-full object-cover opacity-0 transition-opacity duration-700">
                </div>
                <div class="p-4 border-t border-slate-800/60">
                    <span class="mono-font text-[10px] text-emerald-400 uppercase tracking-widest block mb-1">人文街拍</span>
                    <h3 class="text-sm font-bold text-slate-200">街角的确定性</h3>
                </div>
            </article>

            <article data-photo-card class="photo-card-parallax glass-card rounded-xl overflow-hidden">
                <div class="relative aspect-[16/10] overflow-hidden bg-slate-900">
                    <div data-skeleton class="skeleton-shimmer absolute inset-0 z-10 transition-opacity duration-500"></div>
                    <img data-src="assets/photo3.jpg" alt="自然风光" class="w-full h-full object-cover opacity-0 transition-opacity duration-700">
                </div>
                <div class="p-4 border-t border-slate-800/60">
                    <span class="mono-font text-[10px] text-emerald-400 uppercase tracking-widest block mb-1">自然风光</span>
                    <h3 class="text-sm font-bold text-slate-200">远山与薄雾</h3>
                </div>
            </article>

            <article data-photo-card class="photo-card-parallax glass-card rounded-xl overflow-hidden sm:col-span-2">
                <div class="relative aspect-[21/9] overflow-hidden bg-slate-900">
                    <div data-skeleton class="skeleton-shimmer absolute inset-0 z-10 transition-opacity duration-500"></div>
                    <img data-src="assets/photo4.jpg" alt="全景建筑" class="w-full h-full object-cover opacity-0 transition-opacity duration-700">
                </div>
                <div class="p-4 border-t border-slate-800/60">
                    <span class="mono-font text-[10px] text-emerald-400 uppercase tracking-widest block mb-1">全景</span>
                    <h3 class="text-sm font-bold text-slate-200">线性透视与结构韵律</h3>
                </div>
            </article>

            <article data-photo-card class="photo-card-parallax glass-card rounded-xl overflow-hidden">
                <div class="relative aspect-[4/3] overflow-hidden bg-slate-900">
                    <div data-skeleton class="skeleton-shimmer absolute inset-0 z-10 transition-opacity duration-500"></div>
                    <img data-src="assets/photo5.jpg" alt="夜景光轨" class="w-full h-full object-cover opacity-0 transition-opacity duration-700">
                </div>
                <div class="p-4 border-t border-slate-800/60">
                    <span class="mono-font text-[10px] text-emerald-400 uppercase tracking-widest block mb-1">夜景</span>
                    <h3 class="text-sm font-bold text-slate-200">光轨与时间曝光</h3>
                </div>
            </article>

        </div>
    </div>

    <script src="js/photography.js"></script>
</body>
</html>
